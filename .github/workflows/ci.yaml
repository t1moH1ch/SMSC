name: smsc-ci

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Restore
        run: dotnet restore SMSC.sln

      - name: Build
        run: dotnet build SMSC.sln -c Release --no-restore

      - name: Pack
        run: dotnet pack src/SMSC/SMSC.csproj -c Release --no-build -o artifacts

      - name: Resolve package version
        run: |
          NUPKG=$(ls artifacts/*.nupkg | head -n 1)
          BASENAME=$(basename "$NUPKG" .nupkg)
          VERSION=${BASENAME#SMSC.}
          echo "$VERSION" > artifacts/version.txt
          echo "Package version: $VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: nuget-package
          path: |
            artifacts/*.nupkg
            artifacts/version.txt
          retention-days: 30

  test:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Test
        run: dotnet test tests/SMSC.Test/SMSC.Test.csproj -c Release --verbosity normal

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [build, test]
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuget-package
          path: artifacts

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version
        id: version
        run: |
          VERSION=$(cat artifacts/version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Package version: $VERSION"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Expected stable MAJOR.MINOR.PATCH from tag, got: $VERSION"
            exit 1
          fi

      - name: Publish to GitHub Packages
        run: |
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.GITHUB_TOKEN }}" \
            --source "https://nuget.pkg.github.com/t1moH1ch/index.json" \
            --skip-duplicate

      - name: Publish to NuGet.org
        run: |
          if [ -z "${{ secrets.NUGET_API_KEY }}" ]; then
            echo "Secret NUGET_API_KEY is not set"
            exit 1
          fi
          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ secrets.NUGET_API_KEY }}" \
            --source "https://api.nuget.org/v3/index.json" \
            --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: SMSC ${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: artifacts/*.nupkg
